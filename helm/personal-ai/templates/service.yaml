apiVersion: v1
kind: Service
metadata:
  name: {{ include "personal-ai.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "personal-ai.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "personal-ai.name" . }}
    app.kubernetes.io/component: app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
