name: Production Smoke

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      app_url:
        description: Deployment URL
        required: false
        default: https://app.cura-i.com
        type: string
      run_authenticated:
        description: Validate the configured production smoke token
        required: false
        default: false
        type: boolean
      run_mutations:
        description: Run authenticated chat and upload checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: app.cura-i.com smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ inputs.app_url || vars.PROD_APP_URL || 'https://app.cura-i.com' }}
      PROD_SMOKE_AUTH_TOKEN: ${{ secrets.PROD_SMOKE_AUTH_TOKEN }}
      RUN_AUTHENTICATED: ${{ inputs.run_authenticated || vars.PROD_SMOKE_AUTHENTICATED || 'false' }}
      RUN_MUTATIONS: ${{ inputs.run_mutations || vars.PROD_SMOKE_MUTATIONS || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Run production smoke
        run: |
          chmod +x scripts/prod_smoke.sh
          ./scripts/prod_smoke.sh

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Production smoke failed'
            echo
            echo "Target: \`$APP_URL\`"
            echo
            echo 'Inspect the failed step and deployment logs before the next release.'
          } >> "$GITHUB_STEP_SUMMARY"
          BODY="$(printf 'Production smoke failed on [%s](%s).\n\nTarget: `%s`\nWorkflow run: %s' \
            "${GITHUB_SHA:0:7}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            "$APP_URL" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Production smoke failing in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Production smoke failing" --body "$BODY"
          fi
