[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curai-cli"
version = "0.1.0"
description = "CurAI terminal agent for natural-language coding in your project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
curai = "curai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["curai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
