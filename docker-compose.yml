# Personal AI — Docker Compose stack
#
# Profiles (activate with --profile <name> or COMPOSE_PROFILES):
#   local       — Ollama for chat + embeddings (default via `make up`)
#   cloud-chat  — Cloud OpenAI-compatible chat + local Ollama embeddings (`make up-cloud`)
#   gpu-vllm    — vLLM on GPU for chat + local Ollama embeddings (`make up-gpu-vllm`)
#   workers     — ARQ background worker (`make up-workers`)
#
# Examples:
#   docker compose --profile local up -d
#   docker compose --profile cloud-chat -f docker-compose.cloud.yml --env-file .env.cloud up -d
#   docker compose --profile gpu-vllm -f docker-compose.gpu-vllm.yml up -d
#   docker compose --profile local --profile workers up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-ai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - personal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: personal-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - personal-ai-network

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: personal-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    networks:
      - personal-ai-network

  # LLM Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: personal-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - personal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - local
      - cloud-chat
      - gpu-vllm

  # GPU chat runtime (OpenAI-compatible). Embeddings stay on Ollama.
  vllm:
    image: vllm/vllm-openai:latest
    container_name: personal-ai-vllm
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - "--model"
      - "${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - personal-ai-network
    profiles:
      - gpu-vllm

  # App service (FastAPI + built React frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: personal-ai-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
      - DEBUG=false
      - ENABLE_ADAPTER_CACHE=true
      - ADAPTER_CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/personal_ai
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-dev-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - AUTH_SIGNUP_MODE=${AUTH_SIGNUP_MODE:-invite}
      - SETTINGS_SECRET_KEY=${SETTINGS_SECRET_KEY:-}
      - ENABLE_BACKGROUND_WORKERS=true
      - WORKER_QUEUE_BACKEND=arq
      - RUN_STORE_BACKEND=${RUN_STORE_BACKEND:-disk}
      - WORKFLOW_MEMORY_BACKEND=${WORKFLOW_MEMORY_BACKEND:-disk}
      - OBJECT_STORAGE_BACKEND=${OBJECT_STORAGE_BACKEND:-local}
      - OBJECT_STORAGE_LOCAL_PATH=${OBJECT_STORAGE_LOCAL_PATH:-memory/uploads}
      - DEMO_ENABLED=${DEMO_ENABLED:-false}
      - DEMO_MAX_QUESTIONS=${DEMO_MAX_QUESTIONS:-5}
      - DEMO_INTRO=${DEMO_INTRO:-}
      - DEMO_FULL_APP_URL=${DEMO_FULL_APP_URL:-}
      - DEMO_EMBED_ALLOWED_ORIGINS=${DEMO_EMBED_ALLOWED_ORIGINS:-}
      - DEMO_CONTEXT_PATH=${DEMO_CONTEXT_PATH:-}
      - DEMO_CONTEXT_MAX_CHARS=${DEMO_CONTEXT_MAX_CHARS:-8500}
      - DEMO_MAX_HISTORY_MESSAGES=${DEMO_MAX_HISTORY_MESSAGES:-6}
      - DEMO_MAX_OUTPUT_TOKENS=${DEMO_MAX_OUTPUT_TOKENS:-512}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-auto}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    volumes:
      - ./memory:/app/memory
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - personal-ai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: personal-ai-worker
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - DEBUG=false
      - ENABLE_ADAPTER_CACHE=true
      - ADAPTER_CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/personal_ai
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-dev-change-me-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - AUTH_SIGNUP_MODE=${AUTH_SIGNUP_MODE:-invite}
      - SETTINGS_SECRET_KEY=${SETTINGS_SECRET_KEY:-}
      - ENABLE_BACKGROUND_WORKERS=true
      - WORKER_QUEUE_BACKEND=arq
      - RUN_STORE_BACKEND=${RUN_STORE_BACKEND:-disk}
      - WORKFLOW_MEMORY_BACKEND=${WORKFLOW_MEMORY_BACKEND:-disk}
      - OBJECT_STORAGE_BACKEND=${OBJECT_STORAGE_BACKEND:-local}
      - OBJECT_STORAGE_LOCAL_PATH=${OBJECT_STORAGE_LOCAL_PATH:-memory/uploads}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-auto}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    volumes:
      - ./memory:/app/memory
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - personal-ai-network
    command: arq app.workers.settings.WorkerSettings
    profiles:
      - workers

  prometheus:
    image: prom/prometheus:latest
    container_name: personal-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    networks:
      - personal-ai-network

  loki:
    image: grafana/loki:latest
    container_name: personal-ai-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - personal-ai-network

  promtail:
    image: grafana/promtail:latest
    container_name: personal-ai-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - personal-ai-network

  grafana:
    image: grafana/grafana:latest
    container_name: personal-ai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - personal-ai-network

networks:
  personal-ai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  ollama_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
